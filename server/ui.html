    <style>
      /* The scribe palette (see the extension's popup.css): orange-brown and
         recording red, every text color at WCAG AA. Inter and Maple Mono when
         installed, else the system's fonts. */
      :root {
        /* palette:start */
        --bg: #1d1711;
        --surface: #130f0b;
        --line: #4c3929;
        --border: #c9936b;
        --text: #fbefe6;
        --muted: #ecd0b8;
        --rec: #ff4136;
        --button: #c62818;
        --link: #ffc4a8;
        --danger: #ffc4a8;
        --warn: #ffd690;
        --ok: #b5ebb0;
        /* palette:end */
        --sans: "Inter", system-ui, -apple-system, sans-serif;
        --mono: "Maple Mono", ui-monospace, monospace;
        color-scheme: dark;
        accent-color: var(--rec);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--sans);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
      }
      header a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      header .home {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
      }
      header .home img {
        width: 46px;
        height: 32px;
      }
      header a.nav {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 400;
        color: var(--muted);
      }
      header a.nav:hover {
        color: var(--text);
      }
      .icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      header a.nav.hidden {
        display: none;
      }
      #where {
        margin-right: auto;
      }
      .hidden {
        display: none;
      }
      .open {
        margin: 0;
        padding: 10px 24px;
        background: color-mix(in srgb, var(--warn) 14%, var(--bg));
        border-bottom: 1px solid color-mix(in srgb, var(--warn) 45%, var(--bg));
        color: var(--warn);
      }
      input[type="password"] {
        width: min(100%, 420px);
        padding: 8px 10px;
        margin-right: 8px;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: 13px var(--mono);
      }
      .pairing {
        display: block;
        margin: 8px 0 12px;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: 13px var(--mono);
        word-break: break-all;
      }
      textarea {
        width: 100%;
        min-height: 50vh;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font: 13px/1.5 var(--mono);
      }
      button {
        /* A deeper red than the logo's, so white text passes 4.5:1. */
        background: var(--button);
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 7px 14px;
        cursor: pointer;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 24px 120px;
      }
      .muted {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }
      tr.row {
        cursor: pointer;
      }
      tr.row:hover {
        background: var(--surface);
      }
      tr.row a {
        color: inherit;
      }
      .turn:focus-visible {
        outline: 2px solid var(--link);
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        margin: 0 4px 4px 0;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--c, var(--line));
        color: var(--c, var(--text));
        font-size: 12px;
      }
      .players {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        gap: 8px;
        padding: 10px 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      /* One transport over every stream: play, the meeting's clock, and a
         scrubber with a lane per stream kind showing where its audio runs. */
      .player {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .player .play {
        flex: none;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .player .play svg {
        display: block;
        width: 14px;
        height: 14px;
        fill: white;
      }
      .player .play .pause {
        display: none;
      }
      .player .play.going .pause {
        display: block;
      }
      .player .play.going .go {
        display: none;
      }
      .player .time {
        flex: none;
        min-width: 5ch;
        font: 12px var(--mono);
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .scrub {
        position: relative;
        flex: 1;
        height: 26px;
      }
      .scrub .lanes {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: grid;
        gap: 2px;
        pointer-events: none;
      }
      .scrub .lanes .lane {
        position: relative;
        height: 3px;
        border-radius: 2px;
      }
      .scrub .lanes .lane.off {
        opacity: 0.25;
      }
      .scrub .lanes .lane i {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 2px;
        background: currentColor;
      }
      .scrub input {
        position: absolute;
        inset: 0;
        width: 100%;
        margin: 0;
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        cursor: pointer;
      }
      .scrub input::-webkit-slider-runnable-track {
        height: 26px;
        background: transparent;
      }
      .scrub input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 11px;
        height: 11px;
        margin-top: 7.5px;
        border-radius: 50%;
        background: var(--text);
      }
      .scrub input::-moz-range-track {
        height: 26px;
        background: transparent;
      }
      .scrub input::-moz-range-thumb {
        width: 11px;
        height: 11px;
        border: 0;
        border-radius: 50%;
        background: var(--text);
      }
      .scrub input:focus-visible {
        outline: 2px solid var(--link);
        border-radius: 6px;
      }
      /* Which streams are heard: a switch per kind, its dot the lane's color. */
      .pick {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 18px;
        font-size: 12px;
        color: var(--muted);
      }
      .pick label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .pick .dot {
        width: 9px;
        height: 9px;
        border-radius: 2px;
      }
      /* A stream that predates recorded epochs can't sit on the meeting's
         clock; it keeps a native player of its own. */
      .players .solo {
        display: grid;
        gap: 6px;
      }
      .players .solo label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .players .solo label span {
        width: 70px;
        color: var(--muted);
        font-size: 12px;
      }
      audio {
        width: 100%;
        height: 32px;
      }
      .turn {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .turn:hover {
        background: var(--surface);
      }
      .live .turn {
        cursor: default;
      }
      .turn.now {
        background: color-mix(in srgb, var(--rec) 16%, var(--bg));
        box-shadow: inset 3px 0 var(--rec);
      }
      .turn .t {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        padding-top: 2px;
      }
      .turn .who {
        font-weight: 600;
        font-size: 12px;
      }
      .links a {
        color: var(--link);
        margin-right: 14px;
      }
      h2 {
        margin: 18px 0 8px;
        font-size: 15px;
      }
      .cleanup {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin: 14px 0 0;
      }
      .cleanup details {
        flex-basis: 100%;
      }
      .cleanup details .change {
        cursor: pointer;
      }
      button.off {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .turn.kept {
        box-shadow: inset 3px 0 var(--warn);
      }
      pre {
        font-family: var(--mono);
        white-space: pre-wrap;
        background: var(--surface);
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>

    <p id="open" class="open hidden" role="alert">
      No access token is set: anyone who can reach this server can stream to it
      and read every meeting, even on this machine. Set
      <code>SCRIBE_TOKEN_FILE</code> (see the README).
    </p>
    <main id="app"></main>
    <script>
      const app = document.getElementById("app");
      const where = document.getElementById("where");

      const el = (tag, props = {}, ...kids) => {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...kids);
        return e;
      };
      const color = (name) => {
        let h = 0;
        for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
        return `hsl(${h} 75% 82%)`;
      };
      const chip = (name) => {
        const c = el("span", { className: "chip", textContent: name });
        c.style.setProperty("--c", color(name));
        return c;
      };
      const clock = (s) => {
        s = Math.max(0, Math.round(s));
        const h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60),
          sec = s % 60;
        return (
          (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) +
          `:${String(sec).padStart(2, "0")}`
        );
      };
      const when = (ms) => (ms ? new Date(ms).toLocaleString() : "");
      class HttpError extends Error {
        constructor(path, status) {
          super(`${path}: ${status}`);
          this.status = status;
        }
      }
      const api = async (path) => {
        const r = await fetch(path);
        if (!r.ok) throw new HttpError(path, r.status);
        return r.json();
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      // mic, mic-2, … in creation order (a plain sort puts mic-10 before mic-2).
      const stemOrder = (stem) => Number(stem.split("-")[1] ?? 1);

      async function list() {
        where.textContent = "";
        const sessions = await api("/api/sessions");
        if (sessions.length === 0) {
          app.replaceChildren(
            el("p", { className: "muted", textContent: "No sessions yet." }),
          );
          return;
        }
        const rows = sessions.map((s) => {
          const tr = el(
            "tr",
            {
              className: "row",
              onclick: () => (location.hash = `#/s/${s.sessionId}`),
            },
            // A real link, so the row is reachable from the keyboard too.
            el(
              "td",
              {},
              el("a", {
                href: `#/s/${s.sessionId}`,
                textContent: when(s.startedAt ?? s.modified * 1000),
              }),
            ),
            el("td", {
              textContent: s.live
                ? "● live"
                : s.stoppedAt && s.startedAt
                  ? clock((s.stoppedAt - s.startedAt) / 1000)
                  : "",
            }),
            // The meeting's name with its client, or just the client.
            el(
              "td",
              {},
              s.title ?? "",
              el("span", {
                className: "muted",
                textContent:
                  s.title && s.platform ? ` ${s.platform}` : (s.platform ?? ""),
              }),
            ),
            el(
              "td",
              {},
              ...s.speakers.filter((n) => n !== "Unknown").map(chip),
            ),
            el("td", { textContent: s.words || "" }),
            el("td", {
              className: "muted",
              textContent:
                s.channels
                  .filter((c) => c.audio)
                  .map((c) => c.stem)
                  .join(", ") || "none",
            }),
          );
          return tr;
        });
        app.replaceChildren(
          el(
            "table",
            {},
            el(
              "thead",
              {},
              el(
                "tr",
                {},
                ...[
                  "Started",
                  "Length",
                  "Meeting",
                  "Speakers",
                  "Words",
                  "Audio",
                ].map((h) => el("th", { textContent: h })),
              ),
            ),
            el("tbody", {}, ...rows),
          ),
        );
      }

      async function show(id) {
        where.textContent = `/ ${id}`;
        const { session, channels, live, cleaned, voicesRun } = await api(
          `/api/sessions/${id}?cleaned=true`,
        );
        if (session?.title) where.textContent = `/ ${session.title}`;
        if (live) return watchLive(id, session);

        // Each saved stream plays against its own clock: the wall-clock epoch of
        // its first sample.
        const micEpochs = (session?.mic ?? [])
          .map((m) => m.epoch)
          .sort((a, b) => a - b);
        const players = channels
          .filter((c) => c.audio)
          .sort((a, b) =>
            a.stem.localeCompare(b.stem, undefined, { numeric: true }),
          )
          .map((c) => {
            // Streams record their own start (c.epoch); older ones fall back to
            // the extension's record.
            const epoch =
              c.epoch ??
              (c.channel === "tab"
                ? session?.tabEpoch
                : micEpochs[stemOrder(c.stem) - 1]);
            // A stream with no start at all can't sit on the meeting's clock;
            // it keeps a native player of its own, below.
            const audio = el("audio", {
              preload: "metadata",
              controls: epoch == null,
              src: `/api/sessions/${id}/audio/${c.stem}`,
            });
            return { stem: c.stem, group: c.channel, epoch, audio };
          });
        const timed = players.filter((p) => p.epoch != null);
        // Set below when there is audio to run; turns seek through it.
        let playFrom = null;
        // Leaving the page stops whatever is sounding; the transport below
        // replaces this with its own stopper when there is one.
        stopPage = () => {
          for (const p of players) p.audio.pause();
        };

        const segments = session?.segments ?? [];
        const origin = session?.startedAt ?? segments[0]?.at ?? 0;
        // The transport's clock, like the transcript's, starts at the record's
        // first moment, so the numbers beside the turns match.
        const base =
          origin > 0
            ? origin
            : timed.length > 0
              ? Math.min(...timed.map((p) => p.epoch))
              : 0;
        const endAt = () =>
          Math.max(
            base,
            ...timed.map((p) => p.epoch + (p.audio.duration || 0) * 1000),
          );

        // The cleanup model's copy, line for line with the segments, when
        // there is one. The original stays the record and the default view.
        const copy = cleaned?.copy;
        const cleanLines =
          copy?.lines?.length === segments.length ? copy.lines : null;
        const texts = segments.map((seg) =>
          el("div", { textContent: seg.text }),
        );
        // Turns seek through the transport when there is one; `playFrom` is
        // only set below, so this says now what it will say then.
        const playable = timed.length > 0;
        const turns = segments.map((seg, i) =>
          el(
            "div",
            {
              className: "turn",
              onclick: () => seg.at != null && playFrom?.(seg.at),
              // Playable from the keyboard as well when there's audio to seek.
              ...(seg.at != null && playable
                ? {
                    tabIndex: 0,
                    role: "button",
                    title: "Play from here",
                    onkeydown: (event) => {
                      if (event.key !== "Enter" && event.key !== " ") return;
                      event.preventDefault();
                      playFrom(seg.at);
                    },
                  }
                : {}),
            },
            el("div", {
              className: "t",
              textContent:
                seg.at != null ? clock((seg.at - origin) / 1000) : "",
            }),
            el(
              "div",
              {},
              Object.assign(
                el("div", { className: "who", textContent: seg.speaker }),
                {
                  style: `color:${color(seg.speaker)}`,
                },
              ),
              texts[i],
            ),
          ),
        );
        // One transport over every stream. All the audio plays on the meeting's
        // clock, each stream within the window its recorded epoch gives it: a
        // stream that starts later (the mic, a resumed part) is cued until
        // playback reaches it, and one that has ended doesn't stop the rest.
        // A switch per stream kind says which are heard; both are, by default.
        let transport = null;
        let pick = null;
        if (timed.length > 0) {
          // The meeting's now, in wall-clock ms.
          let at = base;
          let playing = false;
          let scrubbing = false;
          let raf = 0;
          let last = 0;

          const play = el("button", {
            className: "play",
            ariaLabel: "Play",
            onclick: () => {
              playing = !playing;
              // Play at the end starts over, the way a player should.
              if (playing && at >= endAt() - 250) at = base;
              if (playing) start();
              // apply() right away: the first tick would otherwise see the
              // streams still parked at the end and call the meeting over.
              apply();
              paint();
            },
          });
          play.append(
            el("span", {
              className: "go",
              innerHTML:
                '<svg viewBox="0 0 24 24"><path d="M7.5 4.5v15l13-7.5z"/></svg>',
            }),
            el("span", {
              className: "pause",
              innerHTML:
                '<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>',
            }),
          );
          const nowEl = el("span", { className: "time", textContent: "0:00" });
          const totalEl = el("span", { className: "time" });
          const range = el("input", {
            type: "range",
            min: 0,
            max: 1,
            step: 1,
            value: 0,
            ariaLabel: "Seek",
          });
          // Scrubbing previews on the clock alone; on release the streams are
          // put where the clock says.
          range.addEventListener("input", () => {
            scrubbing = true;
            at = base + range.value * 1000;
            nowEl.textContent = clock((at - base) / 1000);
          });
          range.addEventListener("change", () => {
            scrubbing = false;
            apply();
            paint();
          });

          const lanes = el("div", { className: "lanes" });
          const laneBits = [];
          pick = el("div", { className: "pick" });
          const KINDS = [
            { key: "tab", label: "Meeting audio", color: "var(--border)" },
            { key: "mic", label: "Your audio", color: "var(--ok)" },
          ];
          for (const kind of KINDS) {
            const tracks = timed.filter((p) => p.group === kind.key);
            if (tracks.length === 0) continue;
            const lane = el("div", {
              className: "lane",
              style: `color:${kind.color}`,
            });
            const bits = tracks.map((p) => {
              const bit = el("i");
              lane.append(bit);
              return { bit, p };
            });
            lanes.append(lane);
            laneBits.push(bits);
            const box = el("input", { type: "checkbox", checked: true });
            // A switched-off stream keeps its place on the clock, unheard.
            box.addEventListener("change", () => {
              for (const p of tracks) p.audio.muted = !box.checked;
              lane.classList.toggle("off", !box.checked);
            });
            pick.append(
              el(
                "label",
                {},
                box,
                el("span", {
                  className: "dot",
                  style: `background:${kind.color}`,
                }),
                el("span", {
                  textContent: kind.label,
                  title: `${kind.label}: ${tracks.map((p) => p.stem).join(", ")}`,
                }),
              ),
            );
          }
          // Put every stream where the meeting's clock says it is: playing if
          // the transport is, cued and paused when outside its window.
          const apply = () => {
            for (const p of timed) {
              const d = p.audio.duration; // NaN until metadata loads
              const t = (at - p.epoch) / 1000;
              const out = t < 0 || (d && t >= d);
              if (out) {
                if (!p.audio.paused) p.audio.pause();
                const cue = d ? Math.min(Math.max(t, 0), d) : 0;
                if (p.audio.currentTime !== cue) p.audio.currentTime = cue;
              } else {
                if (Math.abs(p.audio.currentTime - t) > 0.35)
                  p.audio.currentTime = Math.max(t, 0);
                if (playing && p.audio.paused) p.audio.play().catch(() => {});
                if (!playing && !p.audio.paused) p.audio.pause();
              }
            }
          };

          const paint = () => {
            play.classList.toggle("going", playing);
            play.ariaLabel = playing ? "Pause" : "Play";
            nowEl.textContent = clock((at - base) / 1000);
            totalEl.textContent = clock((endAt() - base) / 1000);
            if (!scrubbing) range.value = (at - base) / 1000;
            range.max = Math.max((endAt() - base) / 1000, 1);
            const span = Math.max(endAt() - base, 1);
            for (const bits of laneBits)
              for (const { bit, p } of bits) {
                const from = p.epoch;
                const to = p.audio.duration
                  ? p.epoch + p.audio.duration * 1000
                  : endAt();
                bit.style.left = `${Math.max(0, ((from - base) / span) * 100)}%`;
                bit.style.width = `${Math.max(0, Math.min(100, ((to - from) / span) * 100))}%`;
              }
            // Highlight the line being heard.
            let now = -1;
            segments.forEach((s, i) => {
              if (s.at != null && s.at <= at) now = i;
            });
            turns.forEach((t, i) => t.classList.toggle("now", i === now));
          };

          // While playing, the clock follows whichever streams are running; in
          // a gap between them it runs on wall time, so the next one joins.
          // A drag on the scrubber owns the clock until it's released.
          const tick = (now) => {
            if (!scrubbing) {
              const live = timed.filter(
                (p) => !p.audio.paused && !p.audio.ended,
              );
              if (live.length > 0) {
                at = Math.max(
                  at,
                  ...live.map((p) => p.epoch + p.audio.currentTime * 1000),
                );
              } else if (
                timed.every(
                  (p) =>
                    // A seek still in flight hasn't landed anywhere yet;
                    // its ended/paused state is stale until it does.
                    !p.audio.seeking &&
                    (p.audio.ended ||
                      at >= p.epoch + (p.audio.duration || 0) * 1000),
                )
              ) {
                // Nothing left to run: every stream ended, or was parked at
                // its end by a seek. The transport rests at the meeting's end.
                playing = false;
                at = endAt();
              } else if (last && now > last) {
                at = Math.min(at + (now - last), endAt());
              }
              apply();
            }
            last = now;
            paint();
            raf = playing || scrubbing ? requestAnimationFrame(tick) : 0;
          };
          const start = () => {
            cancelAnimationFrame(raf);
            last = 0;
            raf = requestAnimationFrame(tick);
          };

          transport = el(
            "div",
            { className: "player" },
            play,
            nowEl,
            el("div", { className: "scrub" }, lanes, range),
            totalEl,
          );
          // The streams live in the document, unseen: some browsers won't
          // play one that was never attached.
          for (const p of timed) {
            p.audio.hidden = true;
            transport.append(p.audio);
          }

          playFrom = (atMs) => {
            at = Math.min(Math.max(atMs, base), endAt());
            playing = true;
            start();
            apply();
            paint();
          };
          stopPage = () => {
            playing = false;
            scrubbing = false;
            cancelAnimationFrame(raf);
            for (const p of players) p.audio.pause();
          };
          paint();
          // Where each stream's audio runs, filled in as durations arrive.
          for (const p of timed)
            p.audio.addEventListener("durationchange", paint);
        }

        const showCleaned = (on) => {
          segments.forEach((seg, i) => {
            const line = on ? cleanLines[i] : null;
            texts[i].textContent = line
              ? line.text || "(only filler)"
              : seg.text;
            texts[i].className = line && !line.text ? "muted" : "";
            turns[i].classList.toggle("kept", Boolean(line?.keptRaw));
            turns[i].title = line?.keptRaw
              ? "Kept as spoken: the safety check put the original line back"
              : turns[i].tabIndex === 0
                ? "Play from here"
                : "";
          });
        };

        const speakers = [...new Set(segments.map((s) => s.speaker))];
        const bundle = new Blob(
          [JSON.stringify({ sessionId: id, session, channels }, null, 2)],
          {
            type: "application/json",
          },
        );
        const body = [
          el("p", {
            className: "muted",
            textContent: `${when(session?.startedAt)} · ${session?.platform ?? "unknown platform"}`,
          }),
          el("div", {}, ...speakers.map(chip)),
          el(
            "div",
            { className: "links" },
            el("a", {
              href: URL.createObjectURL(bundle),
              download: `scribe-${id}.json`,
              textContent: "debug bundle",
            }),
            ...players.map((p) =>
              el("a", {
                href: p.audio.src,
                download: `${id}-${p.stem}.flac`,
                textContent: `${p.stem}.flac`,
              }),
            ),
          ),
        ];
        const boosted = [...new Set(channels.flatMap((c) => c.boost ?? []))];
        if (boosted.length > 0) {
          body.push(
            el(
              "details",
              {},
              el("summary", {
                textContent: `boosted ${boosted.length} phrases`,
              }),
              el("div", {}, ...boosted.map(chip)),
            ),
          );
        }
        if (players.length > 0) {
          const solos = players.filter((p) => p.epoch == null);
          body.push(
            el(
              "div",
              { className: "players" },
              ...(transport ? [transport, pick] : []),
              ...(solos.length > 0
                ? [
                    el(
                      "div",
                      { className: "solo" },
                      ...solos.map((p) =>
                        el(
                          "label",
                          {},
                          el("span", { textContent: p.stem }),
                          p.audio,
                        ),
                      ),
                    ),
                  ]
                : []),
            ),
          );
        }
        if (turns.length > 0) {
          const voices = voicesBar(
            id,
            session,
            channels,
            voicesRun,
            origin,
            playFrom,
          );
          if (voices) body.push(voices);
          const bar = cleanupBar(id, cleaned, cleanLines, showCleaned);
          if (bar) body.push(bar);
          body.push(el("h2", { textContent: "Transcript" }), ...turns);
        } else {
          // No record from the extension (it never reached Stop): show each saved
          // stream's own words.
          for (const c of channels) {
            body.push(
              el("h2", { textContent: `${c.stem} (raw)` }),
              el("pre", {
                textContent:
                  (c.words ?? []).map((w) => w.word).join(" ") || "(no words)",
              }),
            );
          }
        }
        app.replaceChildren(...body);
      }

      // The cleanup model's copy of a transcript (when the server runs it): an
      // original/cleaned switch, how many lines the safety check kept as
      // spoken, the latest run's progress, and a button to clean (again).
      function cleanupBar(id, cleaned, cleanLines, showCleaned) {
        if (!cleaned?.configured && !cleanLines) return null;
        const bar = el("div", { className: "cleanup" });
        const status = el("span", { className: "muted" });
        const here = location.hash;

        if (cleanLines) {
          const pick = (view) => {
            localStorage.setItem("scribe.view", view);
            showCleaned(view === "cleaned");
            original.className = view === "cleaned" ? "off" : "";
            tidy.className = view === "cleaned" ? "" : "off";
            original.ariaPressed = String(view !== "cleaned");
            tidy.ariaPressed = String(view === "cleaned");
          };
          const original = el("button", {
            textContent: "Original",
            onclick: () => pick("original"),
          });
          const tidy = el("button", {
            textContent: "Cleaned",
            onclick: () => pick("cleaned"),
          });
          bar.append(original, tidy);
          pick(localStorage.getItem("scribe.view") ?? "original");
        }

        const copy = cleaned.copy;
        const describe = (run) => {
          if (run?.status === "queued") return "Cleanup is waiting its turn…";
          if (run?.status === "running")
            return `Cleaning up: ${run.chunksDone} of ${run.chunks} parts done…`;
          const failed =
            run?.status === "failed" ? `Cleanup failed: ${run.error}. ` : "";
          if (!copy) return failed || "Not cleaned up yet.";
          return (
            failed +
            `Cleaned by ${copy.model ?? "the cleanup model"}; ` +
            `${copy.keptRaw} of ${copy.lineCount} lines kept as spoken by the safety check` +
            (copy.stale ? ". The transcript changed since." : ".")
          );
        };
        const busy = (run) => ["queued", "running"].includes(run?.status);
        status.textContent = describe(cleaned.run);

        // Follow a run until it ends, then show the new copy.
        const follow = async () => {
          try {
            for (;;) {
              await sleep(2000);
              if (location.hash !== here) return;
              const { cleaned: now } = await api(`/api/sessions/${id}`);
              status.textContent = describe(now.run);
              if (!busy(now.run)) return route();
            }
          } catch (e) {
            status.textContent = String(e);
          }
        };
        if (cleaned.configured) {
          const again = el("button", {
            className: "off",
            textContent: copy ? "Clean up again" : "Clean up",
            hidden: busy(cleaned.run),
            onclick: async () => {
              again.hidden = true;
              const r = await fetch(`/api/sessions/${id}/clean`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: "{}",
              });
              if (!r.ok) {
                again.hidden = false;
                status.textContent = `Cleanup could not start (${r.status}).`;
                return;
              }
              status.textContent = describe(await r.json());
              follow();
            },
          });
          bar.append(again);
        }
        bar.append(status);
        if (busy(cleaned.run)) follow();
        return bar;
      }

      // Voice correction: what it changed, its latest run, and a button to run
      // it (again) on a session with saved tab audio.
      function voicesBar(id, session, channels, run, origin, seek) {
        const voiced = session?.voices;
        const audio = channels.some((c) => c.channel === "tab" && c.audio);
        if (!voiced && !run && !audio) return null;
        const bar = el("div", { className: "cleanup" });
        const status = el("span", { className: "muted" });
        const here = location.hash;
        const busy = (r) => ["queued", "running"].includes(r?.status);
        const describe = (r) => {
          if (r?.status === "queued")
            return "Voice correction is waiting its turn…";
          if (r?.status === "running") return "Correcting speakers by voice…";
          const failed =
            r?.status === "failed"
              ? `Voice correction failed: ${r.error}. `
              : "";
          if (!voiced) return failed;
          return `${failed}Speakers corrected by voice: ${voiced.changed} of ${voiced.words} words moved.`;
        };
        status.textContent = describe(run);
        const follow = async () => {
          try {
            for (;;) {
              await sleep(2000);
              if (location.hash !== here) return;
              const { voicesRun: now } = await api(`/api/sessions/${id}`);
              status.textContent = describe(now);
              if (!busy(now)) return route();
            }
          } catch (e) {
            status.textContent = String(e);
          }
        };
        if (audio) {
          const start = el("button", {
            className: "off",
            textContent: voiced
              ? "Correct speakers again"
              : "Correct speakers by voice",
            hidden: busy(run),
            onclick: async () => {
              start.hidden = true;
              const r = await fetch(`/api/sessions/${id}/voices`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: "{}",
              });
              if (!r.ok) {
                start.hidden = false;
                status.textContent = `Voice correction could not start (${r.status}).`;
                return;
              }
              status.textContent = describe(await r.json());
              follow();
            },
          });
          bar.append(start);
        }
        bar.append(status);
        // Runs of moved words, so each change reads as one stretch of speech.
        const runs = [];
        for (const c of voiced?.changes ?? []) {
          const last = runs.at(-1);
          if (
            last &&
            last.from === c.from &&
            last.to === c.to &&
            c.at - last.end < 2000
          ) {
            last.words.push(c.word);
            last.end = c.at;
          } else
            runs.push({
              from: c.from,
              to: c.to,
              at: c.at,
              end: c.at,
              words: [c.word],
            });
        }
        if (runs.length > 0) {
          bar.append(
            el(
              "details",
              {},
              el("summary", { textContent: `What changed (${runs.length})` }),
              ...runs.map((r) =>
                el("div", {
                  textContent: `${clock((r.at - origin) / 1000)}  ${r.from} → ${r.to}: ${r.words.join(" ")}`,
                  // Played from just before, to hear who it is.
                  ...(seek
                    ? {
                        className: "change",
                        tabIndex: 0,
                        role: "button",
                        title: "Play from here",
                        onclick: () => seek(r.at - 1000),
                        onkeydown: (event) => {
                          if (event.key !== "Enter" && event.key !== " ")
                            return;
                          event.preventDefault();
                          seek(r.at - 1000);
                        },
                      }
                    : {}),
                }),
              ),
            ),
          );
        }
        if (busy(run)) follow();
        return bar;
      }

      // The extension's join (extension/src/transcript.ts): each word is
      // stamped with its wall-clock time and given whoever its stream's
      // timeline says was talking a little later, when the meeting's
      // active-speaker indicator had caught up; runs of one speaker make a turn.
      const SPEAKER_LEAD_MS = 900;
      function liveTurns(streams) {
        const stamped = [];
        for (const s of streams) {
          if (s.epoch == null) continue;
          for (const w of s.words) {
            const at = s.epoch + ((w.start + w.end) / 2) * 1000;
            let speaker = "Unknown";
            for (const span of s.speakers) {
              if (span.from > at + SPEAKER_LEAD_MS) break;
              speaker = span.name;
            }
            stamped.push({ at, speaker, word: w.word });
          }
        }
        stamped.sort((a, b) => a.at - b.at);
        const turns = [];
        for (const s of stamped) {
          const last = turns.at(-1);
          if (last?.speaker === s.speaker) last.text += ` ${s.word}`;
          else turns.push({ speaker: s.speaker, at: s.at, text: s.word });
        }
        return turns;
      }

      // A session still recording: follow its streams over /ws/watch, applying
      // each {"type": "words", "from", "words"} update the way the extension
      // does (replace from index `from` on) and joining the words with each
      // stream's clock and speakers into turns. Once every stream has closed,
      // the saved session is loaded in its place. A resumed session (the
      // recording restarted in the same meeting) already has a record of its
      // earlier parts, shown above the live turns.
      let watching = null;
      // Stops a shown session's player when the route leaves it: detached
      // audio elements would keep sounding.
      let stopPage = null;
      function watchLive(id, earlier) {
        // stream id -> { words, epoch, speakers, open }
        const streams = new Map();
        const before = (earlier?.segments ?? [])
          .filter((seg) => seg.at != null)
          .map((seg) => ({ speaker: seg.speaker, at: seg.at, text: seg.text }));
        const box = el("div", { className: "live" });
        const status = el("p", {
          className: "muted",
          textContent: before.length
            ? "● recording, live (resumed: the earlier part is above)"
            : "● recording, live",
        });
        app.replaceChildren(status, box);
        let drawing = false;
        const draw = () => {
          if (drawing) return;
          drawing = true;
          requestAnimationFrame(() => {
            drawing = false;
            // A stream of the earlier part still finishing is in both; its
            // live words win.
            const epochs = [...streams.values()]
              .map((x) => x.epoch)
              .filter((e) => e != null);
            const firstLive = epochs.length ? Math.min(...epochs) : Infinity;
            const turns = [
              ...before.filter((turn) => turn.at < firstLive),
              ...liveTurns([...streams.values()]),
            ];
            const origin = turns[0]?.at ?? 0;
            box.replaceChildren(
              ...turns.map((turn) =>
                el(
                  "div",
                  { className: "turn" },
                  el("div", {
                    className: "t",
                    textContent: clock((turn.at - origin) / 1000),
                  }),
                  el(
                    "div",
                    {},
                    Object.assign(
                      el("div", {
                        className: "who",
                        textContent: turn.speaker,
                      }),
                      { style: `color:${color(turn.speaker)}` },
                    ),
                    el("div", { textContent: turn.text }),
                  ),
                ),
              ),
            );
          });
        };
        let over = false;
        const ended = () => {
          over = true;
          ws.close();
          afterLive(id, status, earlier?.stoppedAt ?? null).catch((e) => {
            status.textContent = String(e);
          });
        };
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/ws/watch/${id}`);
        watching = ws;
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          let s = msg.stream && streams.get(msg.stream);
          if (msg.stream && !s) {
            s = { words: [], epoch: null, speakers: [], open: true };
            streams.set(msg.stream, s);
          }
          if (msg.type === "words") {
            s.words.splice(msg.from, Infinity, ...msg.words);
            draw();
          } else if (msg.type === "epoch") {
            s.epoch = msg.epoch;
            draw();
          } else if (msg.type === "speaker") {
            s.speakers.push({ name: msg.name, from: msg.from });
            s.speakers.sort((a, b) => a.from - b.from);
            draw();
          } else if (msg.type === "closed") {
            // Its words stay on screen: the mic can be dropped mid-recording.
            s.open = false;
            if (![...streams.values()].some((x) => x.open)) ended();
          } else if (msg.type === "idle") {
            ended();
          }
        };
        // Dropped mid-recording (the server restarted): look again shortly.
        ws.onclose = (event) => {
          if (over || watching !== ws) return;
          if (event.code === 1008) {
            // Refused as cross-site: a proxy in front rewrites the Host header.
            status.textContent =
              "The server refused the live view (cross-site check). If a reverse proxy is in front, have it pass the Host header through.";
            return;
          }
          const here = location.hash;
          setTimeout(() => location.hash === here && route(), 2000);
        };
      }

      // The streams have ended. The extension posts its record when it stops,
      // which can take a moment; a session that saved no audio has nothing on
      // the server until then, or ever if the upload fails. Keep the live words
      // on screen meanwhile instead of replacing them with a 404. A resumed
      // session's earlier record is there all along, so wait for a newer one.
      async function afterLive(id, status, earlierStop) {
        const here = location.hash;
        status.textContent = "Recording ended. Loading the saved session…";
        for (const wait of [1000, 2000, 4000, 8000]) {
          await sleep(wait);
          if (location.hash !== here) return;
          const r = await fetch(`/api/sessions/${id}`);
          if (r.ok) {
            const { session } = await r.json();
            if (earlierStop == null || session?.stoppedAt !== earlierStop)
              return route();
            continue;
          }
          if (r.status !== 404)
            throw new HttpError(`/api/sessions/${id}`, r.status);
        }
        status.textContent =
          earlierStop == null
            ? "Recording ended. Nothing was saved on the server for this session, so these live words are all there is."
            : "Recording ended, but its full record hasn't reached the server yet. Reload in a moment to see it.";
      }

      // The global boost list: names and jargon scribe should favour when unsure.
      // Each stream also boosts its meeting's participant names.
      async function vocab() {
        where.textContent = "/ vocabulary";
        const { phrases } = await api("/api/vocab");
        const box = el("textarea", {
          value: phrases.join("\n"),
          spellcheck: false,
          ariaLabel: "Boosted phrases, one per line",
        });
        const status = el("span", { className: "muted" });
        const save = el("button", {
          textContent: "Save",
          onclick: async () => {
            const r = await fetch("/api/vocab", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phrases: box.value.split("\n") }),
            });
            const saved = r.ok ? (await r.json()).phrases : null;
            if (saved) box.value = saved.join("\n");
            status.textContent = saved
              ? ` saved ${saved.length} phrases; used by recordings started from now on`
              : ` save failed (${r.status})`;
          },
        });
        app.replaceChildren(
          el("p", {
            className: "muted",
            textContent:
              "One phrase per line: people, products, jargon. Recordings boost these, plus each meeting's participant names.",
          }),
          box,
          el("p", {}, save, status),
        );
      }

      // A token is set and this browser hasn't presented it yet: trade it for
      // the login cookie, which the page, its players and its sockets carry.
      function login() {
        where.textContent = "/ log in";
        const input = el("input", {
          type: "password",
          autocomplete: "current-password",
          ariaLabel: "Access token",
          placeholder: "access token",
        });
        const status = el("span", { className: "muted" });
        const form = el(
          "form",
          {
            onsubmit: async (event) => {
              event.preventDefault();
              const r = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: input.value.trim() }),
              });
              if (r.ok) return route();
              status.textContent = " That token isn't right.";
            },
          },
          input,
          el("button", { type: "submit", textContent: "Log in" }),
          status,
        );
        app.replaceChildren(
          el("p", {
            className: "muted",
            textContent:
              "This server needs its access token, the contents of the file SCRIBE_TOKEN_FILE points to.",
          }),
          form,
        );
        input.focus();
      }

      // The URL to paste into the extension's settings, token included.
      async function pair() {
        where.textContent = "/ pair extension";
        const { url } = await api("/api/pairing");
        const copy = el("button", {
          textContent: "Copy",
          onclick: async () => {
            await navigator.clipboard.writeText(url);
            copy.textContent = "Copied";
          },
        });
        app.replaceChildren(
          el("p", {
            textContent:
              "Paste this into the extension's settings page as the server. It carries the access token, so keep it private.",
          }),
          el("code", { className: "pairing", textContent: url }),
          copy,
        );
      }

      // Whether this server needs a token: when it doesn't, say so on every
      // page; when it does, offer the pairing URL.
      const serverInfo = fetch("/api/info").then((r) => r.json());
      serverInfo.then(({ auth }) => {
        document.getElementById("open").classList.toggle("hidden", auth);
        document.querySelector(".pair").classList.toggle("hidden", !auth);
      });

      async function route() {
        watching?.close();
        watching = null;
        stopPage?.();
        stopPage = null;
        const m = location.hash.match(/^#\/s\/([0-9a-f-]{36})$/);
        try {
          await (location.hash === "#/vocab"
            ? vocab()
            : location.hash === "#/pair"
              ? pair()
              : m
                ? show(m[1])
                : list());
        } catch (e) {
          if (e.status === 401) return login();
          app.replaceChildren(
            e.status === 404
              ? el("p", {
                  className: "muted",
                  textContent:
                    "No such session. It may have streamed without saving audio and never received the extension's record.",
                })
              : el("pre", { textContent: String(e) }),
          );
        }
      }
      addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
