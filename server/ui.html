    <style>
      /* The scribe palette (see the extension's popup.css): orange-brown and
         recording red, every text color at WCAG AA. Inter and Maple Mono when
         installed, else the system's fonts. */
      :root {
        /* palette:start */
        --bg: #1d1711;
        --surface: #130f0b;
        --line: #4c3929;
        --border: #c9936b;
        --text: #fbefe6;
        --muted: #ecd0b8;
        --rec: #ff4136;
        --button: #c62818;
        --link: #ffc4a8;
        --danger: #ffc4a8;
        --warn: #ffd690;
        --ok: #b5ebb0;
        /* palette:end */
        --sans: "Inter", system-ui, -apple-system, sans-serif;
        --mono: "Maple Mono", ui-monospace, monospace;
        color-scheme: dark;
        accent-color: var(--rec);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--sans);
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
      }
      header a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      header .home {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
      }
      header .home img {
        width: 46px;
        height: 32px;
      }
      header a.nav {
        margin-left: auto;
        font-weight: 400;
        color: var(--muted);
      }
      textarea {
        width: 100%;
        min-height: 50vh;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font: 13px/1.5 var(--mono);
      }
      button {
        /* A deeper red than the logo's, so white text passes 4.5:1. */
        background: var(--button);
        color: white;
        border: 0;
        border-radius: 6px;
        padding: 7px 14px;
        cursor: pointer;
      }
      details summary {
        cursor: pointer;
        color: var(--muted);
        margin: 10px 0 4px;
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px 24px 120px;
      }
      .muted {
        color: var(--muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }
      tr.row {
        cursor: pointer;
      }
      tr.row:hover {
        background: var(--surface);
      }
      tr.row a {
        color: inherit;
      }
      .turn:focus-visible {
        outline: 2px solid var(--link);
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        margin: 0 4px 4px 0;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--c, var(--line));
        color: var(--c, var(--text));
        font-size: 12px;
      }
      .players {
        position: sticky;
        top: 0;
        z-index: 1;
        display: grid;
        gap: 6px;
        padding: 10px 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .players label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .players label span {
        width: 70px;
        color: var(--muted);
        font-size: 12px;
      }
      audio {
        width: 100%;
        height: 32px;
      }
      .turn {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .turn:hover {
        background: var(--surface);
      }
      .turn.now {
        background: color-mix(in srgb, var(--rec) 16%, var(--bg));
        box-shadow: inset 3px 0 var(--rec);
      }
      .turn .t {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        padding-top: 2px;
      }
      .turn .who {
        font-weight: 600;
        font-size: 12px;
      }
      .links a {
        color: var(--link);
        margin-right: 14px;
      }
      h2 {
        margin: 18px 0 8px;
        font-size: 15px;
      }
      pre {
        font-family: var(--mono);
        white-space: pre-wrap;
        background: var(--surface);
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>

.7%20L224.8%2C238.5%20L224.9%2C238.0%20L225.2%2C237.2%20L225.7%2C236.3%20L226.3%2C235.2%20L227.0%2C234.0%20L227.8%2C232.8%20L228.6%2C231.5%20L229.5%2C230.3%20L230.3%2C229.1%20L231.0%2C228.1%20L231.5%2C227.3%20L232.0%2C226.7%20L232.2%2C226.4%20L232.3%2C226.3%20L232.1%2C226.4%20L231.7%2C226.7%20L231.2%2C227.2%20L230.4%2C227.9%20L229.5%2C228.7%20L228.6%2C229.6%20L227.5%2C230.5%22%20fill%3D%22none%22%20stroke%3D%22%23ff4136%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20%2F%3E%3Cpath%20d%3D%22M392%2C226%20L372%2C168%20M420%2C228%20L430%2C166%22%20stroke%3D%22%23ff4136%22%20stroke-width%3D%2214%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3Ccircle%20cx%3D%22371%22%20cy%3D%22164%22%20r%3D%2212%22%20fill%3D%22%23ff4136%22%2F%3E%3Ccircle%20cx%3D%22431%22%20cy%3D%22162%22%20r%3D%2212%22%20fill%3D%22%23ff4136%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"/><!-- mark:end -->scribe</a

    </header>
    <main id="app"></main>
    <script>
      const app = document.getElementById("app");
      const where = document.getElementById("where");

      const el = (tag, props = {}, ...kids) => {
        const e = Object.assign(document.createElement(tag), props);
        e.append(...kids);
        return e;
      };
      const color = (name) => {
        let h = 0;
        for (const ch of name) h = (h * 31 + ch.codePointAt(0)) % 360;
        return `hsl(${h} 75% 82%)`;
      };
      const chip = (name) => {
        const c = el("span", { className: "chip", textContent: name });
        c.style.setProperty("--c", color(name));
        return c;
      };
      const clock = (s) => {
        s = Math.max(0, Math.round(s));
        const h = Math.floor(s / 3600),
          m = Math.floor((s % 3600) / 60),
          sec = s % 60;
        return (
          (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) +
          `:${String(sec).padStart(2, "0")}`
        );
      };
      const when = (ms) => (ms ? new Date(ms).toLocaleString() : "");
      class HttpError extends Error {
        constructor(path, status) {
          super(`${path}: ${status}`);
          this.status = status;
        }
      }
      const api = async (path) => {
        const r = await fetch(path);
        if (!r.ok) throw new HttpError(path, r.status);
        return r.json();
      };
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      // mic, mic-2, … in creation order (a plain sort puts mic-10 before mic-2).
      const stemOrder = (stem) => Number(stem.split("-")[1] ?? 1);

      async function list() {
        where.textContent = "";
        const sessions = await api("/api/sessions");
        if (sessions.length === 0) {
          app.replaceChildren(
            el("p", { className: "muted", textContent: "No sessions yet." }),
          );
          return;
        }
        const rows = sessions.map((s) => {
          const tr = el(
            "tr",
            {
              className: "row",
              onclick: () => (location.hash = `#/s/${s.sessionId}`),
            },
            // A real link, so the row is reachable from the keyboard too.
            el(
              "td",
              {},
              el("a", {
                href: `#/s/${s.sessionId}`,
                textContent: when(s.startedAt ?? s.modified * 1000),
              }),
            ),
            el("td", {
              textContent: s.live
                ? "● live"
                : s.stoppedAt && s.startedAt
                  ? clock((s.stoppedAt - s.startedAt) / 1000)
                  : "",
            }),
            el("td", { textContent: s.platform ?? "" }),
            el(
              "td",
              {},
              ...s.speakers.filter((n) => n !== "Unknown").map(chip),
            ),
            el("td", { textContent: s.words || "" }),
            el("td", {
              className: "muted",
              textContent:
                s.channels
                  .filter((c) => c.audio)
                  .map((c) => c.stem)
                  .join(", ") || "none",
            }),
          );
          return tr;
        });
        app.replaceChildren(
          el(
            "table",
            {},
            el(
              "thead",
              {},
              el(
                "tr",
                {},
                ...[
                  "Started",
                  "Length",
                  "Platform",
                  "Speakers",
                  "Words",
                  "Audio",
                ].map((h) => el("th", { textContent: h })),
              ),
            ),
            el("tbody", {}, ...rows),
          ),
        );
      }

      async function show(id) {
        where.textContent = `/ ${id}`;
        const { session, channels, live } = await api(`/api/sessions/${id}`);
        if (live) return watchLive(id);

        // Each saved stream plays against its own clock: the wall-clock epoch of
        // its first sample.
        const micEpochs = (session?.mic ?? [])
          .map((m) => m.epoch)
          .sort((a, b) => a - b);
        const players = channels
          .filter((c) => c.audio)
          .sort((a, b) =>
            a.stem.localeCompare(b.stem, undefined, { numeric: true }),
          )
          .map((c) => {
            // Streams record their own start (c.epoch); older ones fall back to
            // the extension's record.
            const epoch =
              c.epoch ??
              (c.channel === "tab"
                ? session?.tabEpoch
                : micEpochs[stemOrder(c.stem) - 1]);
            const audio = el("audio", {
              controls: true,
              preload: "metadata",
              src: `/api/sessions/${id}/audio/${c.stem}`,
            });
            return { stem: c.stem, epoch, audio };
          });

        const segments = session?.segments ?? [];
        const origin = session?.startedAt ?? segments[0]?.at ?? 0;
        const seekAll = (at) => {
          for (const p of players) {
            if (p.epoch == null) continue;
            const t = (at - p.epoch) / 1000;
            if (t >= 0 && (!p.audio.duration || t <= p.audio.duration)) {
              p.audio.currentTime = t;
              p.audio.play();
            } else {
              p.audio.pause();
            }
          }
        };

        const turns = segments.map((seg) =>
          el(
            "div",
            {
              className: "turn",
              onclick: () => seg.at != null && seekAll(seg.at),
              // Playable from the keyboard as well when there's audio to seek.
              ...(seg.at != null && players.length > 0
                ? {
                    tabIndex: 0,
                    role: "button",
                    title: "Play from here",
                    onkeydown: (event) => {
                      if (event.key !== "Enter" && event.key !== " ") return;
                      event.preventDefault();
                      seekAll(seg.at);
                    },
                  }
                : {}),
            },
            el("div", {
              className: "t",
              textContent:
                seg.at != null ? clock((seg.at - origin) / 1000) : "",
            }),
            el(
              "div",
              {},
              Object.assign(
                el("div", { className: "who", textContent: seg.speaker }),
                {
                  style: `color:${color(seg.speaker)}`,
                },
              ),
              el("div", { textContent: seg.text }),
            ),
          ),
        );

        // Highlight the line being heard, following the tab stream's clock.
        const lead = players.find((p) => p.stem === "tab" && p.epoch != null);
        if (lead) {
          lead.audio.addEventListener("timeupdate", () => {
            const at = lead.epoch + lead.audio.currentTime * 1000;
            let now = -1;
            segments.forEach((s, i) => {
              if (s.at != null && s.at <= at) now = i;
            });
            turns.forEach((t, i) => t.classList.toggle("now", i === now));
          });
        }

        const speakers = [...new Set(segments.map((s) => s.speaker))];
        const bundle = new Blob(
          [JSON.stringify({ sessionId: id, session, channels }, null, 2)],
          {
            type: "application/json",
          },
        );
        const body = [
          el("p", {
            className: "muted",
            textContent: `${when(session?.startedAt)} · ${session?.platform ?? "unknown platform"}`,
          }),
          el("div", {}, ...speakers.map(chip)),
          el(
            "div",
            { className: "links" },
            el("a", {
              href: URL.createObjectURL(bundle),
              download: `scribe-${id}.json`,
              textContent: "debug bundle",
            }),
            ...players.map((p) =>
              el("a", {
                href: p.audio.src,
                download: `${id}-${p.stem}.flac`,
                textContent: `${p.stem}.flac`,
              }),
            ),
          ),
        ];
        const boosted = [...new Set(channels.flatMap((c) => c.boost ?? []))];
        if (boosted.length > 0) {
          body.push(
            el(
              "details",
              {},
              el("summary", {
                textContent: `boosted ${boosted.length} phrases`,
              }),
              el("div", {}, ...boosted.map(chip)),
            ),
          );
        }
        if (players.length > 0) {
          body.push(
            el(
              "div",
              { className: "players" },
              ...players.map((p) =>
                el("label", {}, el("span", { textContent: p.stem }), p.audio),
              ),
            ),
          );
        }
        if (turns.length > 0) {
          body.push(el("h2", { textContent: "Transcript" }), ...turns);
        } else {
          // No record from the extension (it never reached Stop): show each saved
          // stream's own words.
          for (const c of channels) {
            body.push(
              el("h2", { textContent: `${c.stem} (raw)` }),
              el("pre", {
                textContent:
                  (c.words ?? []).map((w) => w.word).join(" ") || "(no words)",
              }),
            );
          }
        }
        app.replaceChildren(...body);
      }

      // A session still recording: follow its streams over /ws/watch, applying
      // each {"type": "words", "from", "words"} update the way the extension
      // does (replace from index `from` on). Once every stream has closed, the
      // saved session is loaded in its place.
      let watching = null;
      function watchLive(id) {
        const streams = new Map(); // stream id -> { channel, words, pre }
        const box = el("div");
        const status = el("p", {
          className: "muted",
          textContent: "● recording, live",
        });
        app.replaceChildren(status, box);
        let over = false;
        const ended = () => {
          over = true;
          ws.close();
          afterLive(id, status).catch((e) => {
            status.textContent = String(e);
          });
        };
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/ws/watch/${id}`);
        watching = ws;
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "words") {
            let s = streams.get(msg.stream);
            if (!s) {
              s = { channel: msg.channel, words: [], pre: el("pre") };
              streams.set(msg.stream, s);
              box.append(el("h2", { textContent: msg.channel }), s.pre);
            }
            s.words.splice(msg.from, Infinity, ...msg.words);
            s.pre.textContent = s.words.map((w) => w.word).join(" ");
          } else if (msg.type === "closed") {
            streams.delete(msg.stream);
            if (streams.size === 0) ended();
          } else if (msg.type === "idle") {
            ended();
          }
        };
        // Dropped mid-recording (the server restarted): look again shortly.
        ws.onclose = (event) => {
          if (over || watching !== ws) return;
          if (event.code === 1008) {
            // Refused as cross-site: a proxy in front rewrites the Host header.
            status.textContent =
              "The server refused the live view (cross-site check). If a reverse proxy is in front, have it pass the Host header through.";
            return;
          }
          const here = location.hash;
          setTimeout(() => location.hash === here && route(), 2000);
        };
      }

      // The streams have ended. The extension posts its record when it stops,
      // which can take a moment; a session that saved no audio has nothing on
      // the server until then, or ever if the upload fails. Keep the live words
      // on screen meanwhile instead of replacing them with a 404.
      async function afterLive(id, status) {
        const here = location.hash;
        status.textContent = "Recording ended. Loading the saved session…";
        for (const wait of [1000, 2000, 4000, 8000]) {
          await sleep(wait);
          if (location.hash !== here) return;
          const r = await fetch(`/api/sessions/${id}`);
          if (r.ok) return route();
          if (r.status !== 404)
            throw new HttpError(`/api/sessions/${id}`, r.status);
        }
        status.textContent =
          "Recording ended. Nothing was saved on the server for this session, so these live words are all there is.";
      }

      // The global boost list: names and jargon scribe should favour when unsure.
      // Each stream also boosts its meeting's participant names.
      async function vocab() {
        where.textContent = "/ vocabulary";
        const { phrases } = await api("/api/vocab");
        const box = el("textarea", {
          value: phrases.join("\n"),
          spellcheck: false,
          ariaLabel: "Boosted phrases, one per line",
        });
        const status = el("span", { className: "muted" });
        const save = el("button", {
          textContent: "Save",
          onclick: async () => {
            const r = await fetch("/api/vocab", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phrases: box.value.split("\n") }),
            });
            const saved = r.ok ? (await r.json()).phrases : null;
            if (saved) box.value = saved.join("\n");
            status.textContent = saved
              ? ` saved ${saved.length} phrases; used by recordings started from now on`
              : ` save failed (${r.status})`;
          },
        });
        app.replaceChildren(
          el("p", {
            className: "muted",
            textContent:
              "One phrase per line: people, products, jargon. Recordings boost these, plus each meeting's participant names.",
          }),
          box,
          el("p", {}, save, status),
        );
      }

      async function route() {
        watching?.close();
        watching = null;
        const m = location.hash.match(/^#\/s\/([0-9a-f-]{36})$/);
        try {
          await (location.hash === "#/vocab"
            ? vocab()
            : m
              ? show(m[1])
              : list());
        } catch (e) {
          app.replaceChildren(
            e.status === 404
              ? el("p", {
                  className: "muted",
                  textContent:
                    "No such session. It may have streamed without saving audio and never received the extension's record.",
                })
              : el("pre", { textContent: String(e) }),
          );
        }
      }
      addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
