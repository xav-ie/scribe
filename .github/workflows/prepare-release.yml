name: Prepare release

# Keeps a "chore: prepare release" PR open with the next version and its changelog, built from the
# change files in .changeset/. Merging it runs release.yml.
on:
  # Manual only until the first release; then add back `push: branches: [main]`
  # so every push keeps the release PR up to date. Set the version (0.1.0 for
  # the first release), or leave it empty to compute it from the change files.
  workflow_dispatch:
    inputs:
      version:
        description: Version for the release PR (empty = from the change files)
        required: false

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions: {}

jobs:
  prepare-release:
    # The release PR's own merge has nothing left to prepare.
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the release branch
      pull-requests: write # open or update the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for change files
        id: changes
        run: |
          if compgen -G ".changeset/*.md" >/dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "Nothing to release"; fi
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.changes.outputs.any
        with:
          version: 0.23.0
      - name: Open or update the release PR
        if: steps.changes.outputs.any
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          knope prepare-release --verbose ${VERSION:+--override-version "$VERSION"}
