name: Release

# Runs when the release PR from prepare-release.yml merges, publishing the version in
# extension/package.json: the extension's zip (manifest at its root, as Chrome's "Load unpacked"
# and the Web Store expect) on a v<version> GitHub release with CHANGELOG.md's notes.
# To retry one that failed part-way, re-run its failed jobs from the run's page.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  extension:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and zip
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          pnpm build
          mkdir -p "$RUNNER_TEMP/artifacts"
          ( cd dist && zip -r "$RUNNER_TEMP/artifacts/meeting-capture-extension-v$VERSION.zip" . )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: ${{ runner.temp }}/artifacts/*.zip

  # Tags v<version> and creates the GitHub release with CHANGELOG.md's notes and the zip.
  release:
    needs: [extension]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag and create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.extension.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: artifacts
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose
