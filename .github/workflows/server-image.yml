name: Server image

# Builds the server image (server/Dockerfile) and, for releases, pushes it to
# ghcr.io/<owner>/scribe as :<version> and :latest. Run it by hand to check
# that the image still builds; it only pushes when asked to.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      push:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      push:
        description: Push to ghcr.io as :latest (otherwise build only)
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/scribe
      VERSION: ${{ inputs.version || 'dev' }}
      PUSH: ${{ inputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      # The CUDA wheels make a multi-GB image; the runner's preinstalled
      # toolchains are dead weight here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - name: Build
        run: |
          docker build server --build-context cleanup=models/cleanup \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest"
          docker image ls "$IMAGE"
      - name: Push
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$VERSION" != dev ]; then docker push "$IMAGE:$VERSION"; fi
          docker push "$IMAGE:latest"
