name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when new commits land on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    strategy:
      fail-fast: false
      matrix:
        task: [check:types, check:lint, check:format, check:knip, check:test, build, a11y]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.task }}

  # tsc, eslint and prettier for scribe-desktop. Its GObject types are
  # generated from the GIR files the desktop dev shell provides.
  scribe-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check scribe-desktop
        run: nix develop .#desktop --command bash -c 'cd scribe-desktop && pnpm install --frozen-lockfile && pnpm check'
      - name: Check the web UI's formatting
        run: nix develop .#desktop --command bash -c 'cd scribe-desktop && pnpm exec prettier --check ../server/ui.html'

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
