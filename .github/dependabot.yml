version: 2

updates:
  # The cooldown waits 14 days after a release before proposing it, so a
  # compromised release that gets yanked within days never lands here. Minor
  # and patch updates come grouped; each major version comes on its own, since
  # those can need code changes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet; revisit when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The server image's base, pinned by digest in server/Dockerfile.
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
