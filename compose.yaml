# The scribe server on an NVIDIA GPU (needs the NVIDIA container toolkit):
#   openssl rand -hex 32 > scribe-token   # the access token, once
#   docker compose up -d
# then log in at http://localhost:8000 and pair the extension from there.
services:
  scribe:
    image: ghcr.io/xav-ie/scribe:latest
    # build: server   # or build it from this checkout instead
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scribe:/cache # model cache, recordings, vocabulary
    secrets:
      - scribe-token
    environment:
      SCRIBE_TOKEN_FILE: /run/secrets/scribe-token
      # Host names the server answers to (see the README's security note).
      SCRIBE_ALLOWED_HOSTS: localhost,127.0.0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  scribe:

secrets:
  scribe-token:
    file: ./scribe-token
