<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Capture</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <span id="mark" class="mark" aria-hidden="true"></span>
      <h1>Meeting Capture</h1>
      <span id="status" class="status idle">idle</span>
    </header>

    <button id="record" class="primary">Start recording</button>

    <section class="options">
      <div class="row">
        <span>My microphone</span>
        <a id="micSetup" href="#" class="link">grant&nbsp;access</a>
      </div>

      <label class="row">
        <input type="checkbox" id="saveAudio" />
        <span>Save audio on the streaming service</span>
      </label>

      <label class="row">
        <input type="checkbox" id="debug" />
        <span>Debug: log speaker detection</span>
      </label>

      <button id="exportDebug" class="secondary">Download debug bundle</button>

      <div class="field">
        <span>Streaming service</span>
        <code id="wsUrl"></code>
        <a id="openOptions" href="#" class="link">change in settings</a>
      </div>
    </section>

    <div id="error" class="error hidden"></div>
    <div id="warning" class="warning hidden"></div>
    <div id="insecure" class="warning hidden">
      This server has no access token: anyone who can reach it can stream to it
      and read every meeting, even on this machine. Set SCRIBE_TOKEN_FILE on the
      server.
    </div>

    <section id="result" class="result hidden">
      <h2>Live transcript</h2>
      <div id="speakers" class="speakers"></div>
      <div id="transcript" class="script"></div>
    </section>

    <footer id="build" class="build"></footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
